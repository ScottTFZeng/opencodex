[package]
name = "opencodex-desktop"
version = "2.7.31"
description = "OpenCodex Windows desktop shell"
authors = ["OpenCodex"]
edition = "2021"
rust-version = "1.77.2"

[features]
# CI only: never enabled by the normal desktop build or release workflow.
desktop-test-hook = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
